baseURL: "/"
languageCode: en-us
title: "༧"
enableGitInfo: true
permalinks:
  about: "/"

menu:
  main:
    - identifier: "about"
      name: "about"
      url: "/about/"
      weight: 1
    - identifier: "posts"
      name: "posts"
      url: "/posts/"
      weight: 3
    - identifier: "cv"
      name: "cv"
      url: "/cv/"
      weight: 2
    - identifier: "photography"
      name: "photography"
      url: "/photography/"
      weight: 4

markup:
  tableOfContents:
    endLevel: 4
    ordered: false
    startLevel: 2
  highlight:
    codeFences: true
    guessSyntax: true
    style: github-dark
    lineNumbersInTable: true
    noClasses: true
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - html
    - rss
    - json
  page:
    - html

module:
  imports:
    - path: github.com/barklan/hugo-dead-simple

params:
  # CSVs that the see repo pushes every 15 minutes; read by the activity viz and the landing page art
  seeDataURL: "https://raw.githubusercontent.com/bilals12/see/main/"
  # a row needs up to 5 + 15 + 5 minutes (see, the sync job, the raw cache) to get here; older data means idle
  seeLiveMinutes: 30