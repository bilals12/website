<div id="activity-visualization" data-url="{{ site.Params.seeDataURL }}" data-live-minutes="{{ site.Params.seeLiveMinutes }}">
    <div id="stats">
        <div class="stat-box">
            <div class="stat-label">left clicks</div>
            <div class="stat-value" id="leftclicks">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">right clicks</div>
            <div class="stat-value" id="rightclicks">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">keypresses</div>
            <div class="stat-value" id="keypresses">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">mouse movement</div>
            <div class="stat-value" id="mousemoves">0m</div>
        </div>
    </div>

    <div class="viz-heading">last 24 hours</div>
    <div id="chart" class="term"></div>
    <div class="viz-footer">
        <div id="summary"></div>
        <div id="live"></div>
    </div>

    <div id="week" hidden>
        <div class="viz-heading">last 7 days, keypresses per hour</div>
        <div id="heatmap" class="term"></div>
    </div>
</div>

<script src="{{ "/viz/visualization.js" | relURL }}"></script>


<style>
#activity-visualization {
    color: #0f0;
    font-family: monospace;
    margin: 2rem 0;
}

#activity-visualization #stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;
    text-align: center;
}

#activity-visualization .stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
}

#activity-visualization .stat-label {
    font-size: 1.2em;
    margin-bottom: 0.5em;
}

#activity-visualization .stat-value {
    font-size: 2em;
}

#activity-visualization .viz-heading {
    margin: 28px 0 8px;
    font-size: 0.95em;
    opacity: 0.7;
}

#activity-visualization #chart {
    border: 1px dotted #0f0;
    padding: 4px 16px 12px;
}

#activity-visualization .term {
    white-space: pre;
    line-height: 1;
    cursor: default;
    user-select: none;
}

/* fixed-width cells: a fallback font for the block glyphs cannot shift the columns */
#activity-visualization .spark span {
    display: inline-block;
    width: 1ch;
    vertical-align: top;
}

#activity-visualization .spark-label {
    display: flex;
    justify-content: space-between;
    margin: 12px 0 4px;
    font-size: 1.05em;
}

#activity-visualization .spark-label span:last-child,
#activity-visualization .axis {
    opacity: 0.6;
}

#activity-visualization .axis {
    margin-top: 6px;
}

#activity-visualization .hl {
    background: rgba(0, 255, 0, 0.3);
}

#activity-visualization .viz-footer {
    display: flex;
    justify-content: space-between;
    gap: 1em;
    margin-top: 8px;
    font-size: 0.95em;
    opacity: 0.7;
}

#activity-visualization .live-dot {
    animation: viz-blink 1.2s steps(1) infinite;
}

@keyframes viz-blink {
    50% { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
    #activity-visualization .live-dot {
        animation: none;
    }
}

#activity-visualization #heatmap {
    line-height: 1.3;
    overflow-x: auto;
}

#activity-visualization #heatmap span {
    display: inline-block;
    width: 2ch;
}

#activity-visualization #heatmap .l0 {
    opacity: 0.3;
}

@media screen and (max-width: 768px) {
    #activity-visualization #stats {
        grid-template-columns: repeat(2, 1fr);
    }

    #activity-visualization .stat-value {
        font-size: 1.5em;
    }
}

/* global: the tooltip is appended to body */
.tooltip {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    background: rgba(0, 18, 0, 0.95);
    border: 1px solid #0f0;
    color: #0f0;
    padding: 8px;
    border-radius: 4px;
    font-family: monospace;
    z-index: 1000;
    white-space: nowrap;
}

.tooltip .tooltip-head {
    font-weight: bold;
    margin-bottom: 5px;
    border-bottom: 1px solid #0f0;
}
</style>
